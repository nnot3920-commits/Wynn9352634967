<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 Not Found - Link Disabled</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #090d16;
      background-image: 
        radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
        radial-gradient(circle at top left, rgba(239, 68, 68, 0.12), transparent 40%),
        radial-gradient(circle at bottom right, rgba(59, 130, 246, 0.12), transparent 40%);
      background-size: 28px 28px, 100% 100%, 100% 100%;
      color: #f8fafc;
      padding: 20px;
      overflow: hidden;
      position: relative;
    }

    /* Floating Background Orbs */
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      z-index: 0;
      animation: orbFloat 10s ease-in-out infinite alternate;
      pointer-events: none;
    }

    .orb-1 {
      width: 280px;
      height: 280px;
      background: rgba(239, 68, 68, 0.22);
      top: -60px;
      left: -60px;
    }

    .orb-2 {
      width: 320px;
      height: 320px;
      background: rgba(139, 92, 246, 0.2);
      bottom: -80px;
      right: -80px;
      animation-delay: -5s;
    }

    @keyframes orbFloat {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(35px, 25px) scale(1.1); }
    }

    /* Glassmorphism Card */
    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 460px;
      background: rgba(15, 23, 42, 0.78);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      padding: 36px 28px;
      text-align: center;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.65);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Top Shimmer Accent Bar */
    .card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: linear-gradient(90deg, #ef4444, #f59e0b, #10b981, #3b82f6, #a855f7, #ef4444);
      background-size: 300% 100%;
      animation: shimmerBar 5s linear infinite;
    }

    @keyframes shimmerBar {
      0% { background-position: 0% 50%; }
      100% { background-position: 300% 50%; }
    }

    /* Status Badge */
    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: rgba(239, 68, 68, 0.14);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #fca5a5;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      padding: 6px 14px;
      border-radius: 999px;
      margin-bottom: 16px;
    }

    .dot {
      width: 8px;
      height: 8px;
      background-color: #ef4444;
      border-radius: 50%;
      box-shadow: 0 0 8px #ef4444;
      animation: pulseDot 1.4s infinite;
    }

    @keyframes pulseDot {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.4); opacity: 0.5; }
    }

    /* Animated Shaking & Color-Changing 404 */
    .error-404 {
      display: block;
      width: 100%;
      text-align: center;
      font-size: 92px;
      font-weight: 900;
      line-height: 1.05;
      letter-spacing: 4px;
      margin: 4px 0 10px;
      user-select: none;
      animation: 
        wobbleShake 1.8s ease-in-out infinite,
        colorShift 6s linear infinite;
    }

    @keyframes wobbleShake {
      0%, 100% {
        transform: translate(0, 0) rotate(0deg) scale(1);
      }
      15% {
        transform: translate(-5px, -3px) rotate(-3deg) scale(1.03);
      }
      30% {
        transform: translate(5px, -2px) rotate(3deg) scale(1.03);
      }
      45% {
        transform: translate(-4px, 2px) rotate(-2deg) scale(1.01);
      }
      60% {
        transform: translate(4px, 2px) rotate(2deg) scale(1.01);
      }
      75% {
        transform: translate(-2px, -2px) rotate(-1deg) scale(1);
      }
      90% {
        transform: translate(2px, 1px) rotate(1deg) scale(1);
      }
    }

    @keyframes colorShift {
      0% {
        color: #ff4d4d;
        text-shadow: 0 0 25px rgba(255, 77, 77, 0.65);
      }
      20% {
        color: #ffae00;
        text-shadow: 0 0 25px rgba(255, 174, 0, 0.65);
      }
      40% {
        color: #10b981;
        text-shadow: 0 0 25px rgba(16, 185, 129, 0.65);
      }
      60% {
        color: #38bdf8;
        text-shadow: 0 0 25px rgba(56, 189, 248, 0.65);
      }
      80% {
        color: #c084fc;
        text-shadow: 0 0 25px rgba(192, 132, 252, 0.65);
      }
      100% {
        color: #ff4d4d;
        text-shadow: 0 0 25px rgba(255, 77, 77, 0.65);
      }
    }

    .subtitle {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #94a3b8;
      margin-bottom: 18px;
    }

    .divider {
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.12), transparent);
      margin-bottom: 18px;
    }

    .title {
      font-size: 21px;
      font-weight: 700;
      color: #f1f5f9;
      margin-bottom: 10px;
    }

    .message {
      font-size: 14.5px;
      line-height: 1.65;
      color: #cbd5e1;
      margin-bottom: 22px;
    }

    .message strong {
      color: #f87171;
      font-weight: 600;
    }

    /* Reference Box */
    .ref-box {
      width: 100%;
      background: rgba(2, 6, 23, 0.65);
      border: 1px dashed rgba(148, 163, 184, 0.28);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: #94a3b8;
    }

    .ref-id {
      font-family: monospace;
      font-size: 14px;
      font-weight: 600;
      color: #e2e8f0;
      letter-spacing: 0.5px;
    }

    @media (max-width: 480px) {
      .error-404 {
        font-size: 76px;
      }
      .card {
        padding: 32px 20px;
      }
      .title {
        font-size: 19px;
      }
    }
  </style>
</head>
<body>

  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="card">
    <div class="badge">
      <span class="dot"></span>
      Service Suspended
    </div>

    <div class="error-404">404</div>
    <div class="subtitle">Page Not Found</div>

    <div class="divider"></div>

    <h1 class="title">Link Temporarily Off</h1>
    <p class="message">
      <strong>Payment nahi hone ke karan</strong> aapka link off kar diya gaya hai. Kripya service dubara chalu karwane ke liye <strong>Admin se contact karein</strong>.
    </p>

    <div class="ref-box">
      <span>Reference ID</span>
      <span class="ref-id">#ACC-2026-8849</span>
    </div>
  </div>

</body>
</html>
